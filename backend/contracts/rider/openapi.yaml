    get:
      tags:
      - delivery
      operationId: getRoute
      summary: Get the route to the gate
      description: Refresh after a road closure. Keep the last route on screen on a weak signal. Until the routing engine, this is a straight line from the rider's last position to the gate, with eta_source placeholder and no eta_s, so keep turn-by-turn directions on the phone.
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /orders/{order_id}/handover:
    post:
      tags:
      - delivery
      operationId: handOver
      summary: Hand over the order
      description: 'Sends the OTP the customer shows, and the quantities. Recorded once. Queue the event
        first, and use its event_id as the Idempotency-Key, so the direct and queued paths count as one.
        A repeat by the same rider after success returns success. Allowed from PACKED, TIMER_RUNNING or
        ARRIVED, and from RIDER_ACCEPTED once the code was released after a lost signal. Rejected with
        rider_not_near if the handover is current and fresh GPS shows the rider away from the gate.
        Errors, all 409: wrong_otp, otp_attempts_exceeded, handover_not_allowed, rider_not_near,
        order_cancelled, order_reassigned.'
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - otp
              - quantities
              - client_time
              properties:
                otp:
                  type: string
                  pattern: ^[0-9]{4,8}$
                quantities:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/HandoverQuantity'
                client_time:
                  type: string
                  format: date-time
                  description: Device time. The server sets the official time.
      responses:
        '200':
          description: Handed over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /orders/{order_id}/call:
    post:
      tags:
      - delivery
      operationId: startRiderMaskedCall
      summary: Call the customer through a masked number
      description: 'Errors: call_not_available (409). Priority P2.'
      parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: The number to call.
          content:
            application/json:
              schema:
