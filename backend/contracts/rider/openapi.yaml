          type: string
          description: A masked number, not the customer's own.
        expires_at:
          type: string
          format: date-time
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    LocationAccepted:
      type: object
      required:
      - next_ping_s
      - server_time
      properties:
        next_ping_s:
          type: integer
          minimum: 1
          description: Seconds until the next ping. About 2 to 3 from packed to arrived, and slower otherwise.
          example: 3
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OfflineEvent:
      description: One queued action. Each type has its own payload.
      oneOf:
      - $ref: '#/components/schemas/LocationEvent'
      - $ref: '#/components/schemas/HandoverEvent'
      - $ref: '#/components/schemas/ProblemEvent'
      - $ref: '#/components/schemas/RestockConfirmEvent'
      - $ref: '#/components/schemas/RestockDeclineEvent'
      - $ref: '#/components/schemas/StockScanEvent'
      discriminator:
        propertyName: type
        mapping:
          location: '#/components/schemas/LocationEvent'
          handover: '#/components/schemas/HandoverEvent'
          problem: '#/components/schemas/ProblemEvent'
          restock_confirm: '#/components/schemas/RestockConfirmEvent'
          restock_decline: '#/components/schemas/RestockDeclineEvent'
          stock_scan: '#/components/schemas/StockScanEvent'
    LocationEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: location
        payload:
          $ref: '#/components/schemas/LocationEventPayload'
        device_time:
          type: string
          format: date-time
    HandoverEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: handover
        payload:
          $ref: '#/components/schemas/HandoverEventPayload'
        device_time:
          type: string
          format: date-time
    ProblemEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: problem
        payload:
          $ref: '#/components/schemas/ProblemEventPayload'
        device_time:
          type: string
          format: date-time
    RestockConfirmEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: restock_confirm
        payload:
          $ref: '#/components/schemas/RestockEventPayload'
        device_time:
          type: string
          format: date-time
    RestockDeclineEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: restock_decline
        payload:
          $ref: '#/components/schemas/RestockEventPayload'
        device_time:
          type: string
          format: date-time
    StockScanEvent:
      type: object
      required:
      - event_id
      - type
      - payload
      - device_time
      properties:
        event_id:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Unique, and created when the event is queued.
        type:
          type: string
          const: stock_scan
        payload:
          $ref: '#/components/schemas/StockScanEventPayload'
        device_time:
          type: string
          format: date-time
    LocationEventPayload:
      type: object
      description: For type location.
      required:
      - lat
      - lng
      - speed_mps
      - accuracy_m
      properties:
        lat:
          type: number
        lng:
          type: number
        speed_mps:
          type: number
          minimum: 0
        accuracy_m:
          type: number
          minimum: 0
    HandoverEventPayload:
      type: object
      description: For type handover.
      required:
      - order_id
      - otp
      - quantities
      properties:
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        otp:
          type: string
          pattern: ^[0-9]{4,8}$
        quantities:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HandoverQuantity'
    ProblemEventPayload:
      type: object
      description: For type problem.
      required:
      - problem_type
      properties:
        problem_type:
          type: string
          enum:
          - breakdown
          - accident
          - gate_closed
          - customer_absent
          - unsafe_route
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        note:
          type: string
          maxLength: 1000
    RestockEventPayload:
      type: object
      description: For types restock_confirm and restock_decline.
      required:
      - request_id
      properties:
        request_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        reason:
          type: string
          maxLength: 200
        quantity_override:
          type: array
          items:
            $ref: '#/components/schemas/RestockLineRequest'
    StockScanEventPayload:
      type: object
      description: For type stock_scan.
      required:
      - lot_code
      properties:
        lot_code:
          type: string
    RejectedEvent:
      type: object
      required:
      - id
      - code
      - message
      - retryable
      properties:
        id:
          type: string
        code:
          type: string
          description: Open list. See Rider offline events in contracts/README.md.
        message:
          type: string
        retryable:
          type: boolean
    EventBatchResult:
      type: object
      required:
      - accepted_ids
      - rejected
      - server_time
      properties:
        accepted_ids:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedEvent'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockLineRequest:
      type: object
      required:
      - item_id
      - qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        qty:
          type: integer
          minimum: 1
          maximum: 500
    RestockLine:
      type: object
      required:
      - item_id
      - name
      - qty
      - filled_qty
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
          example: Burger
        qty:
          type: integer
          minimum: 1
        filled_qty:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Set once the hub has packed. Below qty means a short fill.
    RestockOption:
      type: object
      required:
      - item_id
      - name
      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
    RestockOptions:
      type: object
      required:
      - hubs
      - items
      - server_time
      properties:
        hubs:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/HubRef'
            - type: object
              required:
              - manager_phone
              properties:
                manager_phone:
                  description: The hub manager's number, for Call hub manager. Null until the hub has one.
                  type:
                  - string
                  - 'null'
                  pattern: '^\+[1-9][0-9]{7,14}$'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockOption'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockShortfall:
      type: object
      description: What the hub could not fill, and what it offers instead.
      required:
      - action
      - substitute
      - other_hub
      properties:
        action:
          type: string
          enum:
          - partial
          - substitute
          - other_hub
        substitute:
          oneOf:
          - $ref: '#/components/schemas/RestockOption'
          - type: 'null'
        other_hub:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/HubRef'
            - type: object
              required:
              - distance_m
              properties:
                distance_m:
                  description: Straight-line metres from the rider's node to this hub. Null if it cannot be worked out.
                  type:
                  - integer
                  - 'null'
                  minimum: 0
          - type: 'null'
    RestockSuggestion:
      type: object
      required:
      - id
      - hub
      - items
      - expires_at
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        hub:
          $ref: '#/components/schemas/HubRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockLine'
        expires_at:
          type: string
          format: date-time
    HubRef:
      type: object
      required:
      - id
      - name
      - lat
      - lng
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
    RestockSuggestionList:
      type: object
      required:
      - suggestions
      - server_time
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/RestockSuggestion'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RestockRequest:
      type: object
      required:
      - id
      - state
      - hub
      - items
      - slot_at
      - arrive_by
      - lot_numbers
      - shortfall
      - ready_in_s
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        state:
          type: string
          enum:
          - suggested
          - confirmed
          - hub_accepted
          - packing
          - ready
          - picked_up
          - received
          - closed
          - expired
          - cancelled
          - partial
        hub:
          $ref: '#/components/schemas/HubRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestockLine'
        shortfall:
          oneOf:
          - $ref: '#/components/schemas/RestockShortfall'
          - type: 'null'
        slot_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The hub's queue slot.
        arrive_by:
          type:
          - string
          - 'null'
          format: date-time
          description: When the rider should arrive.
        lot_numbers:
          type: array
          description: The lots in the cassette, set at ready. The rider's scan is checked against these.
          items:
            type: string
        ready_in_s:
          description: Seconds from now to the hub slot, never below 0. Null without a slot.
          type:
          - integer
          - 'null'
          minimum: 0
    RestockResponse:
      type: object
      required:
      - request
      - server_time
      properties:
        request:
          $ref: '#/components/schemas/RestockRequest'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    ProblemResponse:
      type: object
      required:
      - report_id
      - server_time
      properties:
        report_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OrderEarning:
      type: object
      required:
      - order_id
      - amount
      properties:
        order_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        amount:
          $ref: ../shared/common.yaml#/components/schemas/Money
    Earnings:
      type: object
      required:
      - date
      - orders
      - order_earnings
      - incentives
      - total
      - repositioning
      - repositioning_seconds
      - server_time
      properties:
        date:
          type: string
          format: date
        orders:
          type: integer
          minimum: 0
          description: How many orders.
        order_earnings:
          type: array
          items:
            $ref: '#/components/schemas/OrderEarning'
        total:
          $ref: ../shared/common.yaml#/components/schemas/Money
        incentives:
          $ref: ../shared/common.yaml#/components/schemas/Money
        repositioning:
          $ref: ../shared/common.yaml#/components/schemas/Money
          description: Pay for repositioning time. total is the order earnings, incentives and this.
        repositioning_seconds:
          type: integer
          minimum: 0
          description: Repositioning is paid time.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
