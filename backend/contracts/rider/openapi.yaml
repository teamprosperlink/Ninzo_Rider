      properties:
        item_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          type: string
        qty:
          type: integer
          minimum: 1
    Offer:
      type: object
      required:
      - id
      - order_id
      - items
      - gate
      - expires_at
      - state
      - fencing_token
      - order_number
      - total
      - payment_method
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        order_id:
          type:
          - string
          - 'null'
          description: Set once accepted.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        gate:
          type: object
          description: Where the rider is going.
          required:
          - id
          - label
          - lat
          - lng
          - entry_notes
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            label:
              type: string
            lat:
              type: number
            lng:
              type: number
            entry_notes:
              type:
              - string
              - 'null'
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - open
          - accepted
          - declined
          - expired
          - taken
          - cancelled
        fencing_token:
          type: string
          description: Fixed for the life of the offer. Send with accept, decline and Ready. A device
            holding a token from another offer is rejected with stale_fencing_token.
        order_number:
          description: Readable order number, a letter and four digits such as A2931.
          type: string
          pattern: '^[A-Z][0-9]{4}$'
        total:
          description: What the customer paid for the order.
          $ref: ../shared/common.yaml#/components/schemas/Money
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
    PaymentMethod:
      type: string
      description: 'How the order was paid. Open list. prepaid: paid online before the order was
        offered, so the rider collects nothing and the handover takes the customer''s OTP.'
      enum:
      - prepaid
    OfferList:
      type: object
      required:
      - offers
      - server_time
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderOrder:
      type: object
      description: What the rider sees of an order. It has no countdown fields. The rider sees a calm
        fixed label, so the clock never pressures the rider.
      required:
      - id
      - offer_id
      - fencing_token
      - state
      - seq
      - ended_reason
      - items
      - gate
      - timer_label
      - rider_accepted_at
      - otp_available
      - handed_over_at
      - order_number
      - total
      - payment_method
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        offer_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        fencing_token:
          type: string
          description: Send with Ready, including after a restart.
        state:
          $ref: ../shared/common.yaml#/components/schemas/OrderState
        ended_reason:
          type:
          - string
          - 'null'
          description: Set when this rider no longer has the order. Open list, including cancelled, reassigned,
            failed, timed_out.
        seq:
          type: integer
          minimum: 1
          description: The rider's current seq when this was read.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        gate:
          type: object
          description: Where the rider is going.
          required:
          - id
          - label
          - lat
          - lng
          - entry_notes
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            label:
              type: string
            lat:
              type: number
            lng:
              type: number
            entry_notes:
              type:
              - string
              - 'null'
        timer_label:
          type: string
          description: A fixed label built from this order's timer length. It does not count down.
          example: 1.5 mins
        rider_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        otp_available:
          type: boolean
          description: True once the customer has the OTP to show. Offline, this value may be stale, so
            the app must still allow the rider to enter an OTP.
        handed_over_at:
          type:
          - string
          - 'null'
          format: date-time
        order_number:
          description: Readable order number, a letter and four digits such as A2931.
          type: string
          pattern: '^[A-Z][0-9]{4}$'
        total:
          description: What the customer paid for the order.
          $ref: ../shared/common.yaml#/components/schemas/Money
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
    OrderResponse:
      type: object
      required:
      - order
      - server_time
      properties:
        order:
          $ref: '#/components/schemas/RiderOrder'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RouteResponse:
