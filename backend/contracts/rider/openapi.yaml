      required:
      - id
      - date
      - node_id
      - starts_at
      - ends_at
      - stock_reply
      - replied_at
      - packing
      - ready_at
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        date:
          description: The day, in the zone's local time.
          type: string
          format: date
        node_id:
          description: Where the shift is planned to start. Null if operations have not chosen yet.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        stock_reply:
          description: The rider's answer to the morning stock request. The hub packs only after coming.
          type: string
          enum:
          - pending
          - coming
          - not_today
        replied_at:
          type:
          - string
          - 'null'
          format: date-time
        packing:
          description: 'The hub packing the day''s stock: not_started, packing, then ready.'
          type: string
          enum:
          - not_started
          - packing
          - ready
        ready_at:
          description: When the stock was ready, or when the hub expects it to be while packing. Null
            before packing.
          type:
          - string
          - 'null'
          format: date-time
    ShiftPlanResponse:
      type: object
      required:
      - plan
      - server_time
      properties:
        plan:
          oneOf:
          - $ref: '#/components/schemas/ShiftPlan'
          - type: 'null'
