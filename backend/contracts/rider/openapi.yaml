              properties:
                fencing_token:
                  type: string
      responses:
        '200':
          description: Packed. The rider can ride.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
