          type: string
    RiderSettings:
      type: object
      description: What the rider app works by, from the rider's zone settings. Null where the zone
        has no value.
      required:
      - stock_request_ask_before_s
      - stock_request_reminder_before_s
      - shift_ending_soon_before_s
      - break_extension_s
      - not_at_gate_after_s
      - handover_code_length
      - cancel_pay_cap
      - timer_length_s
      - arrive_m
      - almost_there_m
      - away_from_spot_m
      - low_stock_qty
      - scooter_capacity_qty
      - min_phone_battery_pct
      - min_scooter_battery_pct
      - low_scooter_battery_pct
      - ride_speed_kmh
      - break_options_s
      - add_time_options_s
      - skip_reasons
      - problem_types
      - checklist
      properties:
        timer_length_s:
          type:
          - integer
          - 'null'
        arrive_m:
          description: How close to the hub, the spot or the gate counts as there.
          type:
          - integer
          - 'null'
        almost_there_m:
          type:
          - integer
          - 'null'
        away_from_spot_m:
          type:
          - integer
          - 'null'
        low_stock_qty:
          description: Fewer portions of an item than this suggests a refill.
          type:
          - integer
          - 'null'
        scooter_capacity_qty:
          type:
          - integer
          - 'null'
        min_phone_battery_pct:
          type:
          - integer
          - 'null'
        min_scooter_battery_pct:
          type:
          - integer
          - 'null'
        low_scooter_battery_pct:
          type:
          - integer
          - 'null'
        ride_speed_kmh:
          description: The straight-line speed used for ride times, until real road times.
          type:
          - integer
          - 'null'
        break_options_s:
          type: array
          items:
            type: integer
        add_time_options_s:
          type: array
          items:
            type: integer
        skip_reasons:
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        problem_types:
          description: Each code is a reportProblem type.
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/RiderChoice'
        stock_request_ask_before_s:
          description: How long before the planned start the app asks if the rider is coming.
          type: integer
        stock_request_reminder_before_s:
          description: When a rider who has not answered is reminded.
          type: integer
        shift_ending_soon_before_s:
          type: integer
        break_extension_s:
          description: What "+15 min" adds to a break.
          type: integer
        not_at_gate_after_s:
          description: How long the handover's code step waits, empty, before offering "Customer not at the gate?".
          type: integer
        handover_code_length:
          description: Digits in the customer's handover code.
          type: integer
        cancel_pay_cap:
          description: The most a cancelled prepaid order pays for the trip; under it, the order's price.
          $ref: ../shared/common.yaml#/components/schemas/Money
    RiderSettingsResponse:
      type: object
