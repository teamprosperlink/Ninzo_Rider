openapi: 3.1.0
info:
  title: Ninzo rider API
  version: 0.1.0
  description: The API behind the rider app. The shared rules are in contracts/README.md. Field names
    are final only after the contract review. Until the partner API exists, hub actions come from a simulator.
  contact:
    name: Ninzo backend
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://rider-api.example.invalid/v1
  description: Placeholder. Real URLs are published with the mock server.
security:
- bearerAuth: []
tags:
- name: auth
  description: Sign-in and tokens.
- name: profile
  description: The rider, verification and devices.
- name: shift
  description: Shifts and staging nodes.
- name: stock
  description: Stock on the scooter.
- name: offers
  description: Offers, accept and Ready.
- name: delivery
  description: Route and handover.
- name: location
  description: Location pings and offline sync.
- name: restock
  description: Restock suggestions and requests.
- name: support
  description: Problems and earnings.
paths:
  /auth/otp/request:
    post:
      tags:
      - auth
      operationId: requestOtp
      summary: Send a sign-in code
      description: >-
        Indian mobile numbers only for now. The reply is the same whether or not the account exists,
        and no SMS is sent if it does not.
        Later errors on that request_id behave the same either way. Errors: invalid_request for a
        bad phone number, otp_resend_limit (429) when the resend limit is reached.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  description: In E.164 format.
                  pattern: ^\+91[6-9][0-9]{9}$
                  example: '+919876543210'
      responses:
        '200':
          description: The code was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResult'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/otp/verify:
    post:
      tags:
      - auth
      operationId: verifyOtp
      summary: Sign in with the code
      description: >-
        Errors: invalid_otp and otp_expired (both 400), otp_attempts_exceeded (429). After a
        correct code, a blocked person or suspended rider gets account_blocked (403).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - otp
              properties:
                request_id:
                  type: string
                otp:
                  type: string
                  pattern: ^[0-9]{4,8}$
                  example: '123456'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderSession'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '403':
          $ref: '../shared/common.yaml#/components/responses/Forbidden'
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshToken
      summary: Get a new token pair
      description: Send only one refresh at a time. See Sign-in in contracts/README.md.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: A new pair.
          content:
            application/json:
              schema:
                $ref: ../shared/common.yaml#/components/schemas/TokenPair
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /auth/signout:
    post:
      tags:
      - auth
      operationId: signOut
      summary: Sign out on this device
      description: Ends this device's session, so its refresh token stops working. An access token already issued can work for up to 15 minutes more. Other devices stay signed in.
      responses:
        '200':
          description: Signed out. Doing it twice is fine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '401':
          $ref: '../shared/common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: '../shared/common.yaml#/components/responses/TooManyRequests'
        '500':
          $ref: '../shared/common.yaml#/components/responses/InternalError'
        '503':
          $ref: '../shared/common.yaml#/components/responses/ServiceUnavailable'
  /riders/me:
    get:
      tags:
      - profile
      operationId: getRider
      summary: Get the signed-in rider
      description: Returns the rider's own profile.
      responses:
        '200':
          description: The rider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
    patch:
      tags:
      - profile
      operationId: updateRider
      summary: Change the rider's own details
      description: 'Send at least one of name, email and area. An applicant fills these in while
        applying; an active rider can change them later. email null clears it, area null clears it.
        The phone never changes here. A suspended rider gets 403.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              example:
                name: Ravi Kumar
                email: ravi@example.com
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                email:
                  type:
                  - string
                  - 'null'
                  format: email
                  maxLength: 254
                area:
                  oneOf:
                  - $ref: '#/components/schemas/RiderArea'
                  - type: 'null'
      responses:
        '200':
          description: The rider, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/state:
    get:
      tags:
      - profile
      operationId: getRiderState
      summary: Get everything current for this rider
      description: The authority for the rider stream. Fetch this before showing anything after a reconnect
        or a notification.
      responses:
        '200':
          description: The current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderState'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/verification:
    get:
      tags:
      - profile
      operationId: getVerification
      summary: Get document verification status
      description: Only verified riders can start a shift. Before anything is started the status is pending with reason not_started; a verification past its expiry is expired.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/verification/start:
    post:
      tags:
      - profile
      operationId: startVerification
      summary: Start document verification
      description: A stand-in until DigiLocker. It records a pending request, and ops check the documents by hand, so redirect_url and upload_url are null for now. Errors already_verified and verification_in_progress (both 409).
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              properties:
                method:
                  type: string
                  enum:
                  - digilocker
                  - manual_upload
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStart'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/devices:
    post:
      tags:
      - profile
      operationId: registerRiderDevice
      summary: Register a device for push
      description: Registering a token that already exists updates it.
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - platform
              - push_token
              properties:
                platform:
                  type: string
                  enum:
                  - android
                  - ios
                push_token:
                  type: string
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /riders/me/devices/{device_id}:
    delete:
      tags:
      - profile
      operationId: removeRiderDevice
      summary: Remove a device from push
      description: Called on sign-out.
      parameters:
      - name: device_id
        in: path
        required: true
        description: The device.
        schema:
          $ref: ../shared/common.yaml#/components/schemas/Id
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Done'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /riders/me/shifts/start:
    post:
      tags:
      - shift
      operationId: startShift
      summary: Start a shift
      description: 'A suspended rider gets 403. Errors, all 409: rider_not_approved, rider_not_verified,
        shift_already_open, shift_limit_reached, no_scooter_at_node. A free scooter waiting at the
        node becomes the rider''s for the shift. A node outside the rider''s zone gets 404.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - node_id
              properties:
                node_id:
                  $ref: ../shared/common.yaml#/components/schemas/Id
                device_id:
                  description: The device_id from registerRiderDevice of the phone starting the shift.
                    Optional. It comes back on the shift, so another phone of the same rider can tell
                    the shift is open elsewhere. A device that is not this rider's gets 400.
                  $ref: ../shared/common.yaml#/components/schemas/Id
                checklist:
                  description: The Before you start items the rider ticked, by the codes
                    getRiderSettings lists, each once. Kept with the shift.
                  type: array
                  maxItems: 20
                  items:
                    type: string
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/end:
    post:
      tags:
      - shift
      operationId: endShift
      summary: End the shift
      description: 'Errors, both 409: no_open_shift, order_in_progress.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/online:
    post:
      tags:
      - shift
      operationId: goOnline
      summary: Say the rider is online at their spot
      description: 'Sets online_at once; asking again keeps the first time. Error 409: no_open_shift.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Online.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/break:
    post:
      tags:
      - shift
      operationId: takeBreak
      summary: Take a break, or make the current one longer
      description: 'A rider on a break gets no offers until it ends. length_s counts from the break''s
        start, so sending a longer one extends the break under way. Errors, both 409: no_open_shift,
        order_in_progress.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - length_s
              example:
                length_s: 900
              properties:
                length_s:
                  type: integer
                  minimum: 60
                  maximum: 3600
      responses:
        '200':
          description: On a break.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/break/end:
    post:
      tags:
      - shift
      operationId: endBreak
      summary: End the break
      description: 'Offers can come again. With no break on, it answers the shift as it is. Error 409:
        no_open_shift.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Back from the break.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts/planned-end:
    post:
      tags:
      - shift
      operationId: setPlannedEnd
      summary: Change when the shift is planned to end
      description: 'For "Add time". planned_end_at must be in the future and within 16 hours of the
        shift''s start. Error 409: no_open_shift.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - planned_end_at
              example:
                planned_end_at: '2099-01-01T12:00:00Z'
              properties:
                planned_end_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: The shift, with its new planned end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shifts:
    get:
      tags:
      - shift
      operationId: listShifts
      summary: List the rider's recent shifts
      description: The shifts started in the last `days` days (India time, today included), newest
        first, each with its times and what was delivered. A suspended rider can still see this.
      parameters:
      - name: days
        in: query
        required: false
        description: How many days back, today included. Default 7.
        schema:
          type: integer
          minimum: 1
          maximum: 31
      responses:
        '200':
          description: The shifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftHistory'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/documents:
    get:
      tags:
      - profile
      operationId: listRiderDocuments
      summary: List the rider's document photos
      description: What was uploaded, one per document and side, without the photos themselves.
      responses:
        '200':
          description: The documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderDocumentList'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
    post:
      tags:
      - profile
      operationId: uploadRiderDocument
      summary: Upload one document photo
      description: 'One photo of one side of a document, as base64, at most 700 KB once decoded. A new
        photo replaces the one before. Operations check them by hand until DigiLocker. Errors: 400 for a
        bad photo; 409 already_verified.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              - side
              - content_type
              - data_base64
              example:
                document: aadhaar
                side: front
                content_type: image/jpeg
                data_base64: /9j/4AAQ
              properties:
                document:
                  $ref: '#/components/schemas/DocumentKind'
                side:
                  $ref: '#/components/schemas/DocumentSide'
                content_type:
                  type: string
                  enum:
                  - image/jpeg
                  - image/png
                  - image/webp
                data_base64:
                  type: string
                  minLength: 4
                  maxLength: 933336
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderDocumentResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/settings:
    get:
      tags:
      - profile
      operationId: getRiderSettings
      summary: Get the settings and choices the rider app works by
      description: The rider's zone settings (the timer, the distances, battery levels, stock limits,
