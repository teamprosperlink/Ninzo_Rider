        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /orders/{order_id}/gate-check:
    post:
      tags:
      - delivery
      operationId: checkGate
      summary: Check the gate's QR code or code
      description: 'Compares what the rider scanned or typed with the code printed at the gate. It changes
        nothing, so it takes no Idempotency-Key. checked is false when the gate has no code: arrival is
        then by location alone (decision 0012) and matched is true. The order must be one this rider
        accepted, or 404.'
      parameters:
      - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - value
              example:
                method: code
                value: GATE-4821
              properties:
                method:
                  type: string
                  enum:
                  - qr
                  - code
                value:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateCheck'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /telephony/connect:
    get:
      tags:
      - delivery
      operationId: connectCall
      summary: Tell the telephony provider whom a masked call connects to
      description: Called by the telephony provider's dynamic connect flow, not by the app, when a
        rider calls the virtual number from startRiderMaskedCall. Signed with the webhook key. The
        answer is the customer of the caller's newest open bridge; with format=text, the number alone.
      security: []
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: from
        in: query
        required: true
        description: The caller's number, as the provider writes it.
        schema:
          type: string
          minLength: 1
      - name: to
        in: query
        required: false
        description: The number called; when sent it must be the virtual number.
        schema:
          type: string
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - text
      responses:
        '200':
          description: The number to connect to.
          content:
            application/json:
              schema:
                type: object
                required:
                - number
                - server_time
                properties:
                  number:
                    type: string
                  server_time:
                    $ref: ../shared/common.yaml#/components/schemas/ServerTime
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/location:
    post:
      tags:
      - location
      operationId: locationPing
      summary: Send a location ping
      description: Accepted at once, and processed afterwards. This is what starts and stops the customer's
        timer, so send at the rate in next_ping_s.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - lat
              - lng
              - speed_mps
              - accuracy_m
              - device_time
              properties:
                lat:
                  type: number
                  minimum: -90
                  maximum: 90
                lng:
                  type: number
                  minimum: -180
                  maximum: 180
                speed_mps:
                  type: number
                  minimum: 0
                accuracy_m:
                  type: number
                  minimum: 0
                device_time:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationAccepted'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/events:
    post:
      tags:
      - location
      operationId: sendEventBatch
      summary: Send queued offline events
      description: Applied in the order given, and each event is checked on its own, so one bad event
        never blocks the queue. A repeated event_id returns its first result, accepted or rejected, with
        no second effect. See Rider offline events in contracts/README.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - events
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/OfflineEvent'
      responses:
        '200':
          description: Each event is accepted or rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResult'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/restock-suggestions:
    get:
      tags:
      - restock
      operationId: listRestockSuggestions
      summary: List suggested restocks
      description: Drafted by the system. The rider confirms, edits or declines.
      responses:
        '200':
          description: The suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockSuggestionList'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /restock/{request_id}/confirm:
    post:
      tags:
      - restock
      operationId: confirmRestock
      summary: Confirm a suggested restock
      description: 'A repeated confirm creates no second request. Errors, all 409: suggestion_expired,
        hub_out_of_stock, restock_already_open.'
      parameters:
      - $ref: '#/components/parameters/RestockRequestId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity_override:
                  type: array
                  items:
                    $ref: '#/components/schemas/RestockLineRequest'
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /restock/{request_id}/decline:
    post:
      tags:
      - restock
      operationId: declineRestock
      summary: Decline a suggested restock
      description: It is drafted again at the next stock check.
      parameters:
      - $ref: '#/components/parameters/RestockRequestId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /restock:
    post:
      tags:
      - restock
      operationId: createRestock
      summary: Request a restock
      description: 'For spoiled or damaged units the system cannot see. Duplicates merge into the scooter''s
        one open request while it is confirmed at the same hub; a manual request replaces a suggestion.
        A hub not in the rider''s zone, a paused hub, or no open shift is 404. Errors: hub_out_of_stock,
        restock_already_open (409).'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hub_id
              - items
              properties:
                hub_id:
                  $ref: ../shared/common.yaml#/components/schemas/Id
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    $ref: '#/components/schemas/RestockLineRequest'
                reason:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /restock/options:
    get:
      tags:
      - restock
      operationId: getRestockOptions
      summary: Get hubs and items for a manual request
      description: The hubs in the rider's zone, and the items that can be requested.
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockOptions'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /restock/{request_id}/shortfall-response:
    post:
      tags:
      - restock
      operationId: respondToShortfall
      summary: Answer a shortfall
      description: >-
        For a request the hub sealed short (state partial). A partial fill: accepting keeps what was
        packed (closed if nothing was), refusing cancels the request. A substitute: accepting sends the
        request back to packing with the substitute in place of what was short, refusing keeps what was
        packed. Another hub: accepting opens the whole request there, refusing keeps what was packed here.
        Errors: shortfall_not_open (409).
      parameters:
      - $ref: '#/components/parameters/RestockRequestId'
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accept
              properties:
                accept:
                  type: boolean
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
        '503':
          $ref: ../shared/common.yaml#/components/responses/ServiceUnavailable
  /restock/{request_id}:
    get:
      tags:
      - restock
      operationId: getRestock
      summary: Get a restock request
      description: Shows the queue slot and the hub's progress.
      parameters:
      - $ref: '#/components/parameters/RestockRequestId'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestockResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/problems:
    post:
      tags:
      - support
      operationId: reportProblem
      summary: Report a problem
      description: 'There is no penalty. Support sees it within seconds. An unsafe route never counts against
        the rider. A breakdown or accident takes the scooter out of service: an order the customer has
        not yet seen accepted goes to another rider silently, and one they have seen fails with a full
        refund. Errors: order_not_yours (409) when order_id is not one of the rider''s orders.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - breakdown
                  - accident
                  - gate_closed
                  - customer_absent
                  - unsafe_route
                order_id:
                  $ref: ../shared/common.yaml#/components/schemas/Id
                note:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/earnings:
    get:
      tags:
      - support
      operationId: getEarnings
      summary: Get earnings for a day
      description: Orders, incentives and paid repositioning time. Each order handed over earns the zone's
        rate at the time; the day's incentive comes once the day's orders reach the zone's level; an accepted
        move is paid by the started minute until it ends, up to a cap. A suspended rider can still see this.
      parameters:
      - name: date
        in: query
        required: true
        description: The day, in the zone's local time.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: The day's earnings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Earnings'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shift-plan:
    get:
      tags:
      - shift
      operationId: getShiftPlan
      summary: Get today's planned shift
      description: 'Today''s plan in the zone''s local time: when the shift starts and ends, the
        morning stock request (the rider says they are coming, or not today) and how the hub''s packing
        is going. Operations make the plan. plan is null on a day with none.'
      responses:
        '200':
          description: Today's plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPlanResponse'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/shift-plan/reply:
    post:
      tags:
      - shift
      operationId: replyToShiftPlan
      summary: Answer the morning stock request
      description: 'coming lets the hub pack the rider''s stock; not_today tells it not to. The answer
        can change until the hub starts packing or the shift starts. Errors: 404 with no plan today;
        409 shift_plan_closed once packing has started or the shift''s start has passed.'
      parameters:
      - $ref: ../shared/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reply
              properties:
                reply:
                  type: string
                  enum:
                  - coming
                  - not_today
      responses:
        '200':
          description: The plan, with the answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftPlanResponse'
        '400':
          $ref: ../shared/common.yaml#/components/responses/BadRequest
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '404':
          $ref: ../shared/common.yaml#/components/responses/NotFound
        '409':
          $ref: ../shared/common.yaml#/components/responses/Conflict
        '422':
          $ref: ../shared/common.yaml#/components/responses/IdempotencyKeyReused
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
  /riders/me/notifications:
    get:
      tags:
      - profile
      operationId: listRiderNotifications
      summary: List what the rider was told
      description: The newest 50 notifications, newest first. Each was also sent as a push to the
        rider's devices. A suspended rider can still read this.
      responses:
        '200':
          description: The notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiderNotificationList'
        '401':
          $ref: ../shared/common.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../shared/common.yaml#/components/responses/Forbidden
        '429':
          $ref: ../shared/common.yaml#/components/responses/TooManyRequests
        '500':
          $ref: ../shared/common.yaml#/components/responses/InternalError
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from the sign-in endpoints.
  parameters:
    OfferId:
      name: offer_id
      in: path
      required: true
      description: The offer.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    OrderId:
      name: order_id
      in: path
      required: true
      description: The order.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    RestockRequestId:
      name: request_id
      in: path
      required: true
      description: The restock request or suggestion.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
    LotId:
      name: lot_id
      in: path
      required: true
      description: The lot, as getStock lists it.
      schema:
        $ref: ../shared/common.yaml#/components/schemas/Id
  schemas:
    Done:
      type: object
      required:
      - server_time
      properties:
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    OtpRequestResult:
      type: object
      required:
      - request_id
      - expires_in_s
      - resend_after_s
      - server_time
      properties:
        request_id:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
          example: 300
        resend_after_s:
          type: integer
          minimum: 0
          example: 30
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    RiderSession:
      type: object
      required:
      - access_token
      - refresh_token
      - expires_in_s
      - rider_id
      - status
      - server_time
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in_s:
          type: integer
          minimum: 1
          example: 900
        rider_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        status:
          type: string
          description: Open list, including applicant and active. A suspended rider gets account_blocked instead of a session. An applicant can only apply and see progress.
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Rider:
      type: object
      required:
      - id
      - name
      - status
      - zone_id
      - created_at
      - approved_at
      - email
      - area
      - phone
      properties:
        phone:
          description: The number the rider signs in with.
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        name:
          description: Null until an applicant fills it in.
          type:
          - string
          - 'null'
        zone_id:
          description: Null until a zone is set.
          anyOf:
          - $ref: ../shared/common.yaml#/components/schemas/Id
          - type: 'null'
        status:
          type: string
          description: Open list, including applicant, active, suspended.
        created_at:
          description: When the account was made.
          type: string
          format: date-time
        approved_at:
          description: When the rider was approved. Null before approval.
          type:
          - string
          - 'null'
          format: date-time
        email:
          description: Contact only; it never signs anyone in. Null when not given.
          type:
          - string
          - 'null'
        area:
          description: Where the rider wants to work, as they chose it while applying. Null when not
            given.
          oneOf:
          - $ref: '#/components/schemas/RiderArea'
          - type: 'null'
    RiderArea:
      type: object
      description: A place the rider picked, such as a town or a junction.
      required:
      - name
      - city
      - lat
      - lng
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        city:
          type: string
          maxLength: 80
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    RiderResponse:
      type: object
      required:
      - rider
      - server_time
      properties:
        rider:
          $ref: '#/components/schemas/Rider'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    VerificationResponse:
      type: object
      required:
      - status
      - reason
      - server_time
      properties:
        status:
          type: string
          enum:
          - pending
          - verified
          - failed
          - expired
        reason:
          type:
          - string
          - 'null'
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    VerificationStart:
      type: object
      required:
      - redirect_url
      - upload_url
      - server_time
      properties:
        redirect_url:
          type:
          - string
          - 'null'
          format: uri
        upload_url:
          type:
          - string
          - 'null'
          format: uri
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    DeviceResponse:
      type: object
      required:
      - device_id
      - server_time
      properties:
        device_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        server_time:
          $ref: ../shared/common.yaml#/components/schemas/ServerTime
    Shift:
      type: object
      required:
      - id
      - node_id
      - started_at
      - ended_at
      - node_assigned_at
      - scooter
      - planned_end_at
      - device_id
      - online_at
      - break
      properties:
        id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        node_id:
          $ref: ../shared/common.yaml#/components/schemas/Id
        started_at:
          type: string
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        node_assigned_at:
          description: When the rider was given this node. This is the shift start, or when the rider accepted the last move in the shift (the node changes at accept).
          type: string
          format: date-time
        scooter:
          description: The scooter on this shift.
          type: object
          required:
          - id
          - plate
          - battery_pct
          properties:
            id:
              $ref: ../shared/common.yaml#/components/schemas/Id
            plate:
              type: string
              description: The scooter code shown on the vehicle.
            battery_pct:
              description: Null until scooter data exists.
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
        planned_end_at:
          description: When the shift is planned to end, from the day's shift plan. Null with no plan.
          type:
          - string
          - 'null'
          format: date-time
        device_id:
          description: The device that started the shift. Null when none was sent. If it is not this
            phone's device_id, the shift is open on another phone.
          type:
          - string
          - 'null'
        online_at:
          description: When the rider went online at their spot (goOnline). Null before.
          type:
          - string
          - 'null'
          format: date-time
        break:
          description: The break under way, or null. No offers come during it.
          oneOf:
          - type: object
            required:
            - started_at
            - ends_at
            properties:
              started_at:
                type: string
                format: date-time
              ends_at:
                type: string
                format: date-time
          - type: 'null'
    ShiftResponse:
      type: object
      required:
      - shift
      - server_time
      properties:
        shift:
          $ref: '#/components/schemas/Shift'
        server_time:
